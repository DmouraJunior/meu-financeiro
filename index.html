<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente Financeiro - Gestão Completa</title>
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #e74c3c;
            --warning: #f1c40f;
            --dark: #2c3e50;
            --light: #fdfeff;
            --gradient: linear-gradient(135deg, #6a11cb 0%, #2575fc 0%, #ff00cc 100%);
            --accent-purple: #8e44ad;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--gradient); 
            background-attachment: fixed;
            display: flex; justify-content: center; padding: 20px; min-height: 100vh; margin: 0;
        }

        .container { 
            width: 100%; max-width: 600px; background: rgba(255, 255, 255, 0.95); 
            padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
        }

        .title-container {
            text-align: center;
            color: var(--dark);
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .form { background: #f9f9f9; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #eee; }
        input, select, button { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; margin-top: 8px; }
        
        button { background: var(--accent-purple); color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { opacity: 0.9; }

        .future-planner { margin: 15px 0; padding: 10px; background: #fff; border-radius: 10px; border: 1px dashed var(--accent-purple); }
        .future-planner h4 { margin: 0 0 10px 0; font-size: 0.8rem; color: var(--accent-purple); text-transform: uppercase; }
        .month-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        
        .btn-month { 
            background: #f0f0f0; color: #333; padding: 8px 2px; font-size: 0.65rem; 
            border-radius: 5px; border: 1px solid #ddd; cursor: pointer; text-align: center;
        }
        .btn-month.selected { background: var(--accent-purple); color: white; border-color: #6a11cb; }

        .month-group { margin-bottom: 15px; border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid #ddd; }
        .month-header { 
            background: var(--dark); color: white; padding: 15px; cursor: pointer; 
            display: flex; flex-direction: column; gap: 5px;
        }
        .month-header-top { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .month-summary { display: flex; justify-content: space-between; font-size: 0.75rem; opacity: 0.9; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 5px; }

        .month-content { display: none; padding: 5px; background: #fff; }
        .month-content.active { display: block; }

        .btn-pdf { background: #e67e22; color: white; padding: 5px 10px; font-size: 0.7rem; border-radius: 5px; margin-bottom: 10px; width: auto; }

        .transaction { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        .transaction.is-paid { opacity: 0.6; background: #f4fdf4; }
        .transaction.is-paid strong { text-decoration: line-through; }

        .actions-btns { display: flex; gap: 5px; margin-top: 5px; }
        .btn-action { width: auto; padding: 4px 8px; font-size: 0.65rem; margin: 0; }
        .btn-del { background: #e74c3c; }
        .btn-pay { background: #2ecc71; }

        .tag { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; margin-left: 5px; text-transform: uppercase; font-weight: bold; }
        .tag-receita { background: #d4edda; color: #155724; }
        .tag-fixa { background: #e8daef; color: #6c3483; }
        .tag-extra { background: #fef5e7; color: #af601a; }

        @media print {
            .form, .future-planner, .btn-pdf, .actions-btns, button, h3 { display: none !important; }
            .month-group { display: none; }
            .month-group.print-focus { display: block !important; border: 1px solid #000; }
            .month-content { display: block !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title-container">
        🤖 Agente Financeiro
    </div>

    <div class="form">
        <input type="text" id="desc" placeholder="Descrição (ex: Aluguel, Internet)">
        <input type="number" id="amount" placeholder="Valor (R$)">
        <div class="future-planner">
            <h4>Selecione os meses:</h4>
            <div class="month-buttons" id="month-buttons"></div>
        </div>
        <select id="category">
            <option value="receita">➕ Receita</option>
            <option value="fixa" selected>🏠 Despesa Fixa</option>
            <option value="extra">🍕 Despesa Extra</option>
        </select>
        <button onclick="addTransaction()">Confirmar Lançamento</button>
    </div>

    <div class="history">
        <h3 style="color: var(--dark); border-left: 4px solid var(--accent-purple); padding-left: 10px;">Meus Meses</h3>
        <div id="monthly-container"></div>
    </div>
</div>

<script>
    let transactions = JSON.parse(localStorage.getItem('finances_v14')) || [];
    let selectedMonths = new Set();

    function generateMonthButtons() {
        const container = document.getElementById('month-buttons');
        const months = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        months.forEach((m, index) => {
            const btn = document.createElement('div');
            btn.className = 'btn-month';
            btn.innerText = m;
            btn.onclick = () => {
                if (selectedMonths.has(index)) {
                    selectedMonths.delete(index);
                    btn.classList.remove('selected');
                } else {
                    selectedMonths.add(index);
                    btn.classList.add('selected');
                }
            };
            container.appendChild(btn);
        });
    }

    function updateUI() {
        const container = document.getElementById('monthly-container');
        container.innerHTML = '';
        const groups = {};

        transactions.forEach((t, index) => {
            const date = new Date(t.dueDate + "T12:00:00");
            const monthYear = date.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            if (!groups[monthYear]) groups[monthYear] = [];
            groups[monthYear].push({ ...t, originalIndex: index });
        });

        const sortedMonths = Object.keys(groups).sort((a, b) => new Date(groups[a][0].dueDate) - new Date(groups[b][0].dueDate));

        sortedMonths.forEach(month => {
            let mReceita = 0, mFixa = 0, mExtra = 0;
            groups[month].forEach(t => {
                const val = parseFloat(t.amount);
                if(t.category === 'receita') mReceita += val;
                else if(t.category === 'fixa') mFixa += val;
                else if(t.category === 'extra') mExtra += val;
            });

            const monthDiv = document.createElement('div');
            monthDiv.className = 'month-group';
            monthDiv.id = `group-${month.replace(/\s+/g, '-')}`;
            
            monthDiv.innerHTML = `
                <div class="month-header" onclick="toggleMonth(this)">
                    <div class="month-header-top">
                        <span>📂 ${month.toUpperCase()}</span>
                        <span>Saldo: R$ ${(mReceita - (mFixa + mExtra)).toFixed(2)}</span>
                    </div>
                    <div class="month-summary">
                        <span>Entradas: R$ ${mReceita.toFixed(2)}</span>
                        <span>Gastos: R$ ${(mFixa + mExtra).toFixed(2)}</span>
                    </div>
                </div>
                <div class="month-content">
                    <button class="btn-pdf" onclick="generatePDF('${monthDiv.id}')">🖨️ PDF deste Mês</button>
                    <div class="transaction-list"></div>
                </div>
            `;

            const list = monthDiv.querySelector('.transaction-list');
            groups[month].forEach(t => {
                const div = document.createElement('div');
                div.className = `transaction ${t.paid ? 'is-paid' : ''}`;
                div.innerHTML = `
                    <div>
                        <strong>${t.desc}</strong> <span class="tag tag-${t.category}">${t.category}</span>
                        <div class="actions-btns">
                            <button class="btn-action btn-del" onclick="deleteTransaction(${t.originalIndex})">Apagar</button>
                            ${!t.paid ? `<button class="btn-action btn-pay" onclick="markAsPaid(${t.originalIndex})">Pago</button>` : ''}
                        </div>
                    </div>
                    <strong style="color: ${t.category === 'receita' ? '#27ae60' : '#c0392b'}">R$ ${parseFloat(t.amount).toFixed(2)}</strong>
                `;
                list.appendChild(div);
            });
            container.appendChild(monthDiv);
        });
        localStorage.setItem('finances_v14', JSON.stringify(transactions));
    }

    function toggleMonth(header) {
        header.nextElementSibling.classList.toggle('active');
    }

    function generatePDF(groupId) {
        const allGroups = document.querySelectorAll('.month-group');
        allGroups.forEach(g => g.classList.remove('print-focus'));
        document.getElementById(groupId).classList.add('print-focus');
        window.print();
    }

    function addTransaction() {
        const desc = document.getElementById('desc').value;
        const amount = document.getElementById('amount').value;
        const category = document.getElementById('category').value;
        if (!desc || !amount || selectedMonths.size === 0) return alert("Preencha tudo e selecione os meses!");

        selectedMonths.forEach(mIndex => {
            const date = `${new Date().getFullYear()}-${(mIndex + 1).toString().padStart(2, '0')}-05`;
            transactions.push({ desc, amount, category, dueDate: date, paid: false });
        });

        selectedMonths.clear();
        document.querySelectorAll('.btn-month').forEach(b => b.classList.remove('selected'));
        document.getElementById('desc').value = ''; document.getElementById('amount').value = '';
        updateUI();
    }

    function deleteTransaction(index) {
        if(confirm("Tem certeza que deseja apagar este lançamento?")) {
            transactions.splice(index, 1);
            updateUI();
        }
    }

    function markAsPaid(index) {
        transactions[index].paid = true;
        updateUI();
    }

    generateMonthButtons();
    updateUI();
</script>

</body>
</html>
