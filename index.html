<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente Financeiro - Lançamento em Massa</title>
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #e74c3c;
            --warning: #f1c40f;
            --dark: #2c3e50;
            --light: #fdfeff;
            --gradient: linear-gradient(135deg, #6a11cb 0%, #2575fc 0%, #ff00cc 100%);
            --accent-purple: #8e44ad;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--gradient); 
            background-attachment: fixed;
            display: flex; justify-content: center; padding: 20px; min-height: 100vh; margin: 0;
        }

        .container { 
            width: 100%; max-width: 600px; background: rgba(255, 255, 255, 0.95); 
            padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
        }
        
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { background: var(--dark); color: white; padding: 15px; border-radius: 12px; text-align: center; }
        .card h2 { margin: 5px 0; font-size: 1.2rem; }

        .extra-limit-container {
            background: #fff9e6; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #ffeeba;
        }

        .progress-bar { background: #eee; border-radius: 10px; height: 18px; width: 100%; margin: 10px 0; overflow: hidden; }
        .progress-fill { background: var(--accent-purple); height: 100%; width: 0%; transition: 0.5s; }
        
        .form { background: #f9f9f9; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #eee; }
        input, select, button { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; margin-top: 8px; }
        
        button { background: var(--accent-purple); color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { opacity: 0.9; }

        /* Estilo dos Botões de Seleção Múltipla */
        .future-planner { margin: 15px 0; padding: 10px; background: #fff; border-radius: 10px; border: 1px dashed var(--accent-purple); }
        .future-planner h4 { margin: 0 0 10px 0; font-size: 0.8rem; color: var(--accent-purple); text-transform: uppercase; }
        .month-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        
        .btn-month { 
            background: #f0f0f0; color: #333; padding: 8px 2px; font-size: 0.65rem; 
            border-radius: 5px; border: 1px solid #ddd; cursor: pointer; transition: 0.3s;
        }
        .btn-month.selected { 
            background: var(--accent-purple); 
            color: white; 
            border-color: #6a11cb;
            box-shadow: 0 0 8px rgba(106, 17, 203, 0.4);
        }

        .month-group { margin-bottom: 10px; border-radius: 8px; overflow: hidden; background: #fff; border: 1px solid #ddd; }
        .month-header { 
            background: #eee; padding: 12px; cursor: pointer; 
            font-weight: bold; display: flex; justify-content: space-between; align-items: center;
        }
        .month-content { display: none; padding: 5px; }
        .month-content.active { display: block; }

        .transaction { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        .is-paid { opacity: 0.5; }
        .is-paid strong { text-decoration: line-through; }

        .tag { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; margin-left: 5px; text-transform: uppercase; font-weight: bold; }
        .tag-fixa { background: #e8daef; color: #6c3483; }
        .tag-extra { background: #fef5e7; color: #af601a; }
        .status-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; margin-top: 4px; display: inline-block; }
        .status-vencido { background: #f8d7da; color: #721c24; }
        .status-hoje { background: #d4edda; color: #155724; }
    </style>
</head>
<body>

<div class="container">
    <div class="balance-grid">
        <div class="card" style="background: var(--accent-purple);">
            <span>Saldo Total</span>
            <h2 id="total-balance">R$ 0,00</h2>
        </div>
        <div class="card" style="background: var(--secondary);">
            <span>Despesas Fixas</span>
            <h2 id="total-fixed">R$ 0,00</h2>
        </div>
    </div>

    <div id="extra-alert-box" class="extra-limit-container">
        <strong>Limite Extras: R$ 300,00</strong>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <small id="extra-status">Gasto: R$ 0,00</small>
    </div>

    <div class="form">
        <input type="text" id="desc" placeholder="Descrição (ex: Aluguel, Internet)">
        <input type="number" id="amount" placeholder="Valor (R$)">
        
        <div class="future-planner">
            <h4>Selecione os meses para lançar:</h4>
            <div class="month-buttons" id="month-buttons"></div>
            <p style="font-size: 0.6rem; color: #888; margin-top: 5px;">* Clique em vários meses para duplicar o lançamento.</p>
        </div>

        <select id="category">
            <option value="receita">➕ Receita</option>
            <option value="fixa" selected>🏠 Despesa Fixa</option>
            <option value="extra">🍕 Despesa Extra</option>
        </select>
        <button onclick="addTransaction()">Confirmar em Massa</button>
    </div>

    <div class="history">
        <h3 style="color: var(--dark); border-left: 4px solid var(--accent-purple); padding-left: 10px;">Visualização Mensal</h3>
        <div id="monthly-container"></div>
    </div>
</div>

<script>
    let transactions = JSON.parse(localStorage.getItem('finances_v9')) || [];
    let selectedMonths = new Set(); // Guarda os meses selecionados

    function generateMonthButtons() {
        const container = document.getElementById('month-buttons');
        const months = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        
        months.forEach((m, index) => {
            const btn = document.createElement('div');
            btn.className = 'btn-month';
            btn.innerText = m;
            btn.onclick = () => {
                if (selectedMonths.has(index)) {
                    selectedMonths.delete(index);
                    btn.classList.remove('selected');
                } else {
                    selectedMonths.add(index);
                    btn.classList.add('selected');
                }
            };
            container.appendChild(btn);
        });
    }

    function checkStatus(dateStr, isPaid) {
        if (!dateStr || isPaid) return isPaid ? '<span class="status-badge status-hoje">✔ PAGO</span>' : "";
        const today = new Date(); today.setHours(0,0,0,0);
        const dueDate = new Date(dateStr); dueDate.setHours(24,0,0,0);
        if (dueDate.getTime() === today.getTime()) return '<span class="status-badge status-hoje">📅 HOJE</span>';
        if (dueDate < today) return '<span class="status-badge status-vencido">🚨 VENCIDO</span>';
        return `<span style="font-size:0.65rem; color:#888;">Vence: ${dueDate.toLocaleDateString('pt-BR')}</span>`;
    }

    function updateUI() {
        const container = document.getElementById('monthly-container');
        container.innerHTML = '';
        let total = 0, fixed = 0, extra = 0;

        const groups = {};
        transactions.forEach((t, index) => {
            const date = new Date(t.dueDate + "T12:00:00");
            const monthYear = date.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            if (!groups[monthYear]) groups[monthYear] = [];
            groups[monthYear].push({ ...t, originalIndex: index });
        });

        Object.keys(groups).sort((a,b) => new Date(groups[b][0].dueDate) - new Date(groups[a][0].dueDate)).forEach(month => {
            const monthDiv = document.createElement('div');
            monthDiv.className = 'month-group';
            const header = document.createElement('div');
            header.className = 'month-header';
            header.innerHTML = `<span>📂 ${month.toUpperCase()}</span> <span>Ver +</span>`;
            header.onclick = () => monthDiv.querySelector('.month-content').classList.toggle('active');

            const content = document.createElement('div');
            content.className = 'month-content';

            groups[month].forEach(t => {
                const val = parseFloat(t.amount);
                if(t.category === 'receita') total += val;
                else if(t.category === 'fixa') { total -= val; fixed += val; }
                else if(t.category === 'extra') { total -= val; extra += val; }

                const div = document.createElement('div');
                div.className = `transaction ${t.paid ? 'is-paid' : ''}`;
                div.innerHTML = `
                    <div>
                        <strong>${t.desc}</strong> <span class="tag tag-${t.category}">${t.category}</span><br>
                        ${checkStatus(t.dueDate, t.paid)}<br>
                        <button style="width:auto; padding:3px 8px; font-size:0.6rem; background:#3498db" onclick="editTransaction(${t.originalIndex})">✎</button>
                        ${(t.category === 'fixa' && !t.paid) ? `<button style="width:auto; padding:3px 8px; font-size:0.6rem; background:var(--primary)" onclick="togglePaid(${t.originalIndex})">✔ Pago</button>` : ''}
                    </div>
                    <strong>R$ ${val.toFixed(2)}</strong>
                `;
                content.appendChild(div);
            });
            monthDiv.appendChild(header); monthDiv.appendChild(content); container.appendChild(monthDiv);
        });

        document.getElementById('total-balance').innerText = `R$ ${total.toFixed(2)}`;
        document.getElementById('total-fixed').innerText = `R$ ${fixed.toFixed(2)}`;
        const perc = (extra / 300) * 100;
        document.getElementById('progress-fill').style.width = Math.min(perc, 100) + '%';
        document.getElementById('extra-status').innerText = `Gasto Extra: R$ ${extra.toFixed(2)}`;
        localStorage.setItem('finances_v9', JSON.stringify(transactions));
    }

    function addTransaction() {
        const desc = document.getElementById('desc').value;
        const amount = document.getElementById('amount').value;
        const category = document.getElementById('category').value;
        const currentYear = new Date().getFullYear();

        if (!desc || !amount) return alert("Preencha descrição e valor!");
        if (selectedMonths.size === 0) return alert("Selecione pelo menos um mês nos botões acima!");

        selectedMonths.forEach(mIndex => {
            const monthFormatted = (mIndex + 1).toString().padStart(2, '0');
            const generatedDate = `${currentYear}-${monthFormatted}-05`; // Salva como dia 05 por padrão
            transactions.push({ desc, amount, category, dueDate: generatedDate, paid: false });
        });

        // Limpar tudo
        selectedMonths.clear();
        document.querySelectorAll('.btn-month').forEach(b => b.classList.remove('selected'));
        document.getElementById('desc').value = '';
        document.getElementById('amount').value = '';
        updateUI();
    }

    function editTransaction(index) {
        const t = transactions[index];
        document.getElementById('desc').value = t.desc;
        document.getElementById('amount').value = t.amount;
        transactions.splice(index, 1);
        updateUI();
    }

    function togglePaid(index) {
        transactions[index].paid = true;
        updateUI();
    }

    generateMonthButtons();
    updateUI();
</script>

</body>
</html>
